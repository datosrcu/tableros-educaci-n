{% extends "base.html" %}

{% block content %}
<div class="row min-vh-100 justify-content-center align-items-center">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card shadow border-0 p-5 rounded-4">
            <div class="mb-4">
                <div class="display-1 text-success"><i class="fas fa-check-circle"></i></div>
            </div>
            <h2 class="fw-bold text-dark mb-3">¡Formulario Guardado!</h2>
            <p class="text-muted mb-4">La respuesta se ha registrado exitosamente en el legajo del alumno.</p>
            <div class="d-grid gap-2">
                <button onclick="window.close()" class="btn btn-primary btn-lg rounded-pill shadow-sm">
                    Cerrar ventana
                </button>
                <a href="{% url 'alumnos:dashboard_docente' %}" class="btn btn-link text-muted text-decoration-none">
                    Ir al panel principal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

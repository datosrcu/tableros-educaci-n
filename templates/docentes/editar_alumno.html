{% extends "base.html" %}
{% block content %}
<h2>Editar alumno: {{ alumno.apellido }}, {{ alumno.nombre }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar cambios</button>
</form>

<a href="{% url 'alumnos:alumnos_por_sala' alumno.sala.id %}">← Volver a la sala</a>
{% endblock %}

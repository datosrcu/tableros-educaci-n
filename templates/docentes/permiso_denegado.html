{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="card shadow-sm border-0 py-5">
      <div class="card-body">
        <div class="mb-4 text-danger opacity-75">
          <i class="fas fa-shield-alt fa-5x"></i>
        </div>
        <h2 class="fw-bold text-dark mb-3">Acceso Denegado</h2>
        <p class="text-muted mb-4">No tenés los permisos necesarios para acceder a esta sección o sala.</p>
        <div class="p-3 bg-light rounded border border-light-subtle mb-4 small text-muted">
          <i class="fas fa-info-circle me-1"></i> Si creés que esto es un error, contactá con el equipo de coordinación.
        </div>
        <a href="/" class="btn btn-primary rounded-pill px-5 shadow-sm fw-bold">
          <i class="fas fa-home me-2 text-white-50"></i>Volver al Inicio
        </a>
      </div>
    </div>
  </div>
</div>

<style>
  .border-light-subtle {
    border-color: #e2e8f0 !important;
  }
</style>
{% endblock %}

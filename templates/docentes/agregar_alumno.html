{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0 text-center flex-grow-1">Agregar nuevo alumno a {{ sala.nombre }}</h2>
  </div>

  <form method="post" class="mx-auto" style="max-width: 600px;">
    {% csrf_token %}

    {% for field in form %}
      <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="text-danger small">{{ field.errors }}</div>
        {% endif %}
      </div>
    {% endfor %}

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-success">Guardar alumno</button>
      <a href="{% url 'alumnos:alumnos_por_sala' sala.id %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableros de Gestión Educativa | Municipalidad de Río Cuarto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .header-bg { background-color: #009de0; color: white; }
        .card-dashboard { border: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .card-dashboard:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .icon-box { width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
    </style>
</head>
<body>
    <header class="header-bg py-4 shadow-sm mb-5">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="h3 fw-bold mb-1"><i class="fas fa-chart-line me-2"></i> Tableros de Gestión Educativa</h1>
                <p class="mb-0 text-white-50">Secretaría de Educación - Municipalidad de Río Cuarto</p>
            </div>
            <span class="badge bg-light text-dark px-3 py-2 rounded-pill shadow-sm fw-semibold">
                <i class="fas fa-layer-group text-primary me-1"></i> 5 Tableros Oficiales
            </span>
        </div>
    </header>

    <main class="container pb-5">
        <div class="row g-4">
            {% for t in tableros %}
            <div class="col-md-6 col-lg-4">
                <div class="card card-dashboard h-100 shadow-sm p-4">
                    <div class="d-flex align-items-center mb-3">
                        <div class="icon-box me-3" style="background-color: {{ t.color }};">
                            <i class="fas {{ t.icono }}"></i>
                        </div>
                        <div>
                            <span class="badge text-uppercase micro-text bg-secondary bg-opacity-10 text-secondary mb-1">Programa</span>
                            <h5 class="fw-bold mb-0 text-dark" style="font-size: 1rem;">{{ t.nombre }}</h5>
                        </div>
                    </div>
                    <p class="text-muted small mb-4 flex-grow-1">{{ t.subtitulo }}</p>
                    <a href="{% url t.url_name %}" class="btn btn-outline-primary w-100 rounded-pill fw-semibold shadow-sm">
                        Ver Dashboard <i class="fas fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center small text-white-50">
            <p class="mb-0">© {% now "Y" %} Secretaría de Educación | Municipalidad de Río Cuarto</p>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema Jardines</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  body {
    background-color: #f8f9fa;
    font-family: 'Roboto', sans-serif;
  }
</style>
</head>
<body>

  <div class="container mt-4 border-bottom pb-1 mb-4">
    <div class="row align-items-center">
      
      <!-- Columna izquierda: usuario y logout -->
      <div class="col-md-4">
        {% if user.is_authenticated %}
          <p class="mb-1"><strong>Usuario:</strong> {{ user.first_name }} {{ user.last_name }}</p>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-danger">Cerrar sesión</button>
          </form>
        {% endif %}
      </div>

      <!-- Columna central: título centrado -->
      <div class="col-md-4 text-center">
        <h1 class="m-0">Sistema Jardines</h1>
      </div>

      <!-- Columna derecha vacía para balance visual -->
      <div class="col-md-4"></div>

</div>
    {% block content %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
